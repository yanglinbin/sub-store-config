name: build

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'rules/**'
      - 'templates/**'
      - 'lib/**'
      - 'build/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 4 * * *' # 每天 04:00 UTC 拉上游重建
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装 sing-box（校验 + 后续可编 .srs 用）
        run: |
          curl -fsSL -o sb.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          tar xzf sb.tar.gz
          sudo install -m755 sing-box-1.14.3-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: 缓存上游规则（拉不到时兜底，避免 jsdelivr 抖动导致构建失败）
        uses: actions/cache@v4
        with:
          path: .cache
          key: rules-cache-${{ github.run_id }}
          restore-keys: rules-cache-

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: 运行时冒烟（真跑 sing-box，验证 rule-set 下载与初始化）
        run: npm run probe

      - name: 安装 mihomo 并校验生成的 mihomo 配置
        run: |
          set -e
          V=1.19.33
          URL="https://github.com/MetaCubeX/mihomo/releases/download/v${V}/mihomo-linux-amd64-v${V}.gz"
          if curl -fsSL --retry 3 -o mihomo.gz "$URL"; then
            gunzip -f mihomo.gz
            sudo install -m755 mihomo /usr/local/bin/mihomo
            mihomo -v
            mihomo -t -f dist/mihomo/config.yaml
            echo "mihomo -t OK"
          else
            echo "::warning::mihomo 下载失败，跳过 mihomo -t"
          fi

      - name: 把 dist 推到 dist 分支（单 commit，强制覆盖）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b dist
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "build: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist

      - name: 刷新 jsDelivr 缓存（否则分支内容最长会滞后 12h）
        run: |
          for p in mihomo/config.yaml singbox/template.json scripts/mihomo.js scripts/singbox.js scripts/nodes.js; do
            if curl -fsS --max-time 60 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@dist/$p" >/dev/null; then
              echo "purged $p"
            else
              echo "::warning::purge 失败：$p"
            fi
          done
