mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: :9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: false
proxies: []
proxy-providers: {}
rule-providers:
  category-ads-all:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/category-ads-all.list
    path: ./ruleset/category-ads-all.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/private.list
    path: ./ruleset/private.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/lancidr.list
    path: ./ruleset/lancidr.yaml
    interval: 86400
  f1tv:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/f1tv.list
    path: ./ruleset/f1tv.yaml
    interval: 86400
  microsoft:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/microsoft.list
    path: ./ruleset/microsoft.yaml
    interval: 86400
  apple:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/apple.list
    path: ./ruleset/apple.yaml
    interval: 86400
  icloud:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/icloud.list
    path: ./ruleset/icloud.yaml
    interval: 86400
  steam:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/steam.list
    path: ./ruleset/steam.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/applications.list
    path: ./ruleset/applications.yaml
    interval: 86400
  gfw:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/gfw.list
    path: ./ruleset/gfw.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/cncidr.list
    path: ./ruleset/cncidr.yaml
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/telegramcidr.list
    path: ./ruleset/telegramcidr.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/direct.list
    path: ./ruleset/direct.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/yanglinbin/sub-store-config@dist/mihomo/rules/proxy.list
    path: ./ruleset/proxy.yaml
    interval: 86400
proxy-groups:
  - name: proxies
    type: select
    proxies:
      - DIRECT
  - name: f1tv
    type: select
    proxies:
      - DIRECT
  - name: direct
    type: select
    proxies:
      - DIRECT
  - name: final
    type: select
    proxies:
      - DIRECT
rules:
  - RULE-SET,category-ads-all,REJECT
  - RULE-SET,private,direct
  - RULE-SET,lancidr,direct,no-resolve
  - RULE-SET,f1tv,f1tv
  - RULE-SET,microsoft,direct
  - RULE-SET,apple,direct
  - RULE-SET,icloud,direct
  - RULE-SET,steam,direct
  - RULE-SET,applications,direct
  - RULE-SET,gfw,proxies
  - RULE-SET,cncidr,direct,no-resolve
  - RULE-SET,telegramcidr,proxies
  - RULE-SET,direct,direct
  - RULE-SET,proxy,proxies
