# 上游 proxy.txt（geolocation-!cn）里以 .cn 结尾的域名
# 陷阱：direct.txt 里有一条裸 cn 通配（domain_suffix: cn），而 direct 在 order 里排在 proxy 之前，
# 于是下面这 48 个"境外地理位置"的域名会被当成国内域名直连（services.googleapis.cn 就是这么中招的）。
# 本模块挂在 direct 之前，把它们改判 proxies。
# 来源：proxy 规则集里所有 *.cn 条目。上游更新后重新比对补条目：
#   sing-box rule-set decompile dist/singbox/rules/proxy.srs -o /tmp/proxy.json
#   # 取所有 endswith('.cn') 的 domain_suffix，与下面的列表做差集
