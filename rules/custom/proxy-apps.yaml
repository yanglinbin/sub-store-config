# 代理与隧道客户端 → 直连（防回环）
#
# 为什么必须在所有域名规则之前：这些进程自己的出站流量如果被域名规则判成"代理"，
# 就会自己代理自己（sing-box 连机场域名 → 命中 proxy → 再进 tun）。
# 只看进程名、不看域名，正是这个模块的职责。
#
# 下载器（Thunder / BitComet / qBittorrent / Transmission / aria2 / xdman …）**故意不在
# 这个清单里**：它们要按连接本身分流 —— 下载 GitHub release、docker 镜像这类该走代理，
# 下 BT 这类按 IP 命中 cncidr 或落到 final。以前它们在 upstream applications.txt 里，
# 导致"用下载器下 GitHub 资产被整条直连"。
