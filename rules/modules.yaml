# 模块定义（当前为"重构中"的最小集合：只引用 Loyalsoldier/geoip 一个上游 + 自建 f1tv）
#   kind: remote  → 直引 geoip 官方预编译产物，本地不抓取、不编译
#   kind: built   → 省略即默认：由 rules/custom/*.yaml 构建
#   upstream      → 目前只允许 geoip
#   category      → geoip release 下的文件名（cn / private / telegram / hk / us / jp / …）

geoip-cn:
  kind: remote
  upstream: geoip
  behavior: ipcidr
  category: cn
geoip-private:
  kind: remote
  upstream: geoip
  behavior: ipcidr
  category: private
geoip-telegram:
  kind: remote
  upstream: geoip
  behavior: ipcidr
  category: telegram

f1tv:
  behavior: classical
  custom: rules/custom/f1tv.yaml
