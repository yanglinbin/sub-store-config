# 模块定义：唯一上游 = Loyalsoldier/clash-rules（域名 + IP + 进程），其余为仓库内自定义清单
#   sources → clash-rules 文本（CI 构建时抓取并转成两端产物）
#   custom  → rules/custom/*.yaml（本仓库维护）
#   behavior→ domain | ipcidr | classical（决定 mihomo rule-provider 类型）

# ============ 上游（clash-rules） ============
category-ads-all:
  behavior: domain
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"]
private:
  behavior: domain
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"]
lancidr:
  behavior: ipcidr
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"]
apple:
  behavior: domain
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"]
icloud:
  behavior: domain
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"]
gfw:
  behavior: domain
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"]
applications:
  behavior: classical
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"]
cncidr:
  behavior: ipcidr
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"]
telegramcidr:
  behavior: ipcidr
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"]
direct:
  behavior: domain
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"]
proxy:
  behavior: domain
  sources: ["https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"]

# ============ 自建（仓库内维护） ============
airport:              # 机场入口直连（从订阅分析得出）
  behavior: domain
  custom: rules/custom/airport.yaml
google:               # Google 全域含 google.cn，强制走代理
  behavior: domain
  custom: rules/custom/google.yaml
microsoft:
  behavior: classical
  custom: rules/custom/microsoft.yaml
steam:
  behavior: classical
  custom: rules/custom/steam.yaml
f1tv:
  behavior: classical
  custom: rules/custom/f1tv.yaml
