# 贴进 sub-store.yilabao.top 的 443 server 块，放在已有的 location / 之前。
# 宿主 /data/nginx/html 挂载到容器 /usr/share/nginx/html，所以 sbc-sync-dist.sh
# 写到 /data/nginx/html/sbc/ 的东西在这里就是 /usr/share/nginx/html/sbc/。
location /sbc/ {
    alias /usr/share/nginx/html/sbc/;
    index off;
    autoindex off;
    expires 10m;
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
}
